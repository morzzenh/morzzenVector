version: '3.8'

services:
  database:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: postgres_pgvector
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    command: ["postgres", "-c", "log_statement=all"]
    ports:
      - "${DATABASE_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: .
      target: migrations
    container_name: alembic_migrations
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_embedding
    restart: always
    ports:
      - "${EMBEDDING_PORT}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama-model-loader:
    image: ollama/ollama:latest
    container_name: ai_ollama_loader
    environment:
      - OLLAMA_HOST
    command: pull ${EMBEDDING_MODEL:-bge-m3}
    depends_on:
      ollama:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    container_name: fastapi_app
    restart: on-failure
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      ollama-model-loader:
        condition: service_completed_successfully
