[project]
name = "morzzenvector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "morzzenh", email = "kuznecov.onestory@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "langchain-ollama==1.1.0",
    "langchain-text-splitters==1.1.2",
    "markitdown[docx,pdf]==0.1.8",
    "pgvector==0.5.0",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "sqlalchemy[asyncio]==2.1.1",
    "uvicorn==0.52.0",
]

[project.scripts]
morzzenvector = "morzzenvector:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
