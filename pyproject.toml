[project]
name = "morzzenvector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "morzzenh", email = "kuznecov.onestory@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "langchain-ollama==1.1.0",
    "langchain-text-splitters==1.1.2",
    "markitdown[docx,pdf]==0.1.8",
    "pgvector==0.5.0",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "sqlalchemy[asyncio]==2.1.1",
    "uvicorn==0.52.0",
]

[project.scripts]
morzzenvector = "morzzenvector:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
# 1. ОСНОВНЫЕ НАСТРОЙКИ СТИЛЯ КОДА
# Максимально допустимая длина строки. Если строка длиннее (например, длинный URL-адрес),
# форматтер Ruff автоматически и красиво перенесет её на новую строку.
line-length = 100

# Целевая версия интерпретатора Python. Линтер будет проверять код на соответствие синтаксису
# версии 3.12 (например, разрешит использовать новые удобные f-строки и типы данных).
target-version = "py314"

# Список папок и файлов, которые Ruff должен полностью игнорировать при проверке.
# Сюда включаются системные папки, виртуальные окружения и скрытые файлы Git.
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# 2. НАСТРОЙКА ПРАВИЛ И ПРОВЕРОК (LINTER)
# Главный список категорий правил (префиксов), которые Ruff будет строго контролировать в проекте:
# "E", "F" — Pyflakes и Error (базовый синтаксис Python, неиспользуемые переменные, опечатки).
# "I"      — Isort (автоматическая сортировка всех импортов по алфавиту и разделение их на группы).
# "UP"     — Upgrade (подсказывает, где можно заменить старый синтаксис Python на более современный).
# "B"      — Bugbear (находит неочевидные логические баги, которые могут привести к ошибкам в рантайме).
# "ASYNC"  — Flake8-async (КРИТИЧЕСКИ ВАЖНО ДЛЯ FASTAPI: ищет блокирующие вызовы в асинхронных функциях).
# "S"      — Bandit (анализ безопасности: зашитые пароли, небезопасные генерации случайных чисел и т.д.).
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

# Список конкретных кодов ошибок, которые вы хотите принудительно ИГНОРИРОВАТЬ.
# Пока оставляем пустым `[]`, но если какое-то правило начнет вас раздражать, сюда можно вписать его код.
ignore = []

[tool.ruff.lint.isort]
# 3. НАСТРОЙКА АВТОМАТИЧЕСКОЙ СОРТИРОВКИ ИМПОРТОВ
# Автоматически объединять импорты из одного и того же модуля в одну красивую строку.
# Вместо: `from os import path` и `from os import name` сделает `from os import name, path`.
combine-as-imports = true

# Позволяет принудительно переносить каждый импортируемый элемент на новую строку,
# если они импортируются внутри одной конструкции `from ... import ...`.
force-single-line = false

[tool.ruff.lint.flake8-bugbear]
# 4. НАСТРОЙКА ПОИСКА СКРЫТЫХ БАГОВ
# Разрешить использовать изменяемые типы данных (словари, списки) в качестве аргументов функций
# только в этих конкретных методах FastAPI/Pydantic (чтобы линтер не ругался на валидацию зависимостей).
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

